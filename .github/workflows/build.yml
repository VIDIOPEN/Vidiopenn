name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip Source Code & Fix Project Structure
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Unzipping file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./extracted_app

          PROJ_DIR=$(dirname "$(find ./extracted_app -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)")
          echo "Project directory: $PROJ_DIR"

          cp -r "$PROJ_DIR"/* .

          # Create .env and .env.example files
          echo "GEMINI_API_KEY=AIzaSyPlaceholderKeyForBuildPurposes123" > .env
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          echo "GEMINI_API_KEY=AIzaSyPlaceholderKeyForBuildPurposes123" > app/.env
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > app/.env.example

          # Write app/build.gradle.kts with compileSdk = 36
          cat << 'EOF' > app/build.gradle.kts
          import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy

          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.google.devtools.ksp)
              alias(libs.plugins.roborazzi)
              alias(libs.plugins.secrets)
              alias(libs.plugins.google.services)
          }

          android {
              namespace = "com.example"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.vidiopen.videoplayer"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              signingConfigs {
                  create("release") {
                      val keystorePath = System.getenv("KEYSTORE_PATH") ?: "${rootDir}/my-upload-key.jks"
                      storeFile = file(keystorePath)
                      storePassword = System.getenv("STORE_PASSWORD") ?: "dummyPass123"
                      keyAlias = "upload"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "dummyPass123"
                  }
                  create("debugConfig") {
                      storeFile = file("${rootDir}/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      isCrunchPngs = false
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debugConfig")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          secrets {
              propertiesFileName = ".env"
              defaultPropertiesFileName = ".env.example"
          }

          googleServices {
              missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN
          }

          dependencies {
              implementation(platform(libs.androidx.compose.bom))
              implementation(platform(libs.firebase.bom))
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.camera.camera2)
              implementation(libs.androidx.camera.core)
              implementation(libs.androidx.camera.lifecycle)
              implementation(libs.androidx.camera.view)
              implementation(libs.play.services.mlkit.barcode.scanning)
              implementation(libs.zxing.core)
              implementation(libs.androidx.compose.material.icons.core)
              implementation(libs.androidx.compose.material.icons.extended)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.datastore.preferences)
              implementation(libs.androidx.lifecycle.runtime.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.room.ktx)
              implementation(libs.androidx.room.runtime)
              implementation(libs.coil.compose)
              implementation(libs.coil.video)
              implementation(libs.androidx.media3.exoplayer)
              implementation(libs.androidx.media3.ui)
              implementation(libs.androidx.media3.session)
              implementation(libs.converter.moshi)
              implementation(libs.firebase.ai)
              implementation(libs.firebase.appcheck.recaptcha)
              implementation(libs.kotlinx.coroutines.android)
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.logging.interceptor)
              implementation(libs.moshi.kotlin)
              implementation(libs.okhttp)
              implementation(libs.retrofit)
              
              "ksp"(libs.androidx.room.compiler)
              "ksp"(libs.moshi.kotlin.codegen)
              implementation(libs.google.hilt.android)
              "ksp"(libs.google.hilt.compiler)
              implementation(libs.timber)
              implementation(libs.androidx.work.runtime.ktx)
              implementation(libs.androidx.biometric)
          }
          EOF

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Setup Keystores
        run: |
          # Generate keystore
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass dummyPass123 -keypass dummyPass123 -dname "CN=Build, OU=Dev, O=App, L=City, ST=State, C=IN"
          
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

          # Copy keystores to app directory as well to cover all path references
          cp my-upload-key.jks app/
          cp debug.keystore app/

      - name: Build Debug, Release APK & AAB
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/app/my-upload-key.jks"
          STORE_PASSWORD: "dummyPass123"
          KEY_PASSWORD: "dummyPass123"
          GEMINI_API_KEY: "AIzaSyPlaceholderKeyForBuildPurposes123"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          
