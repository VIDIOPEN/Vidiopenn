name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Variables & Dummy Keystore
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=AIzaSyPlaceholderKeyForBuildPurposes123" > .env
          fi

          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass dummyPass123 -keypass dummyPass123 -dname "CN=Build, OU=Dev, O=App, L=City, ST=State, C=IN"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          GEMINI_API_KEY: "AIzaSyPlaceholderKeyForBuildPurposes123"

      - name: Build Release APK & AAB
        run: gradle assembleRelease bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: "dummyPass123"
          KEY_PASSWORD: "dummyPass123"
          GEMINI_API_KEY: "AIzaSyPlaceholderKeyForBuildPurposes123"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          
